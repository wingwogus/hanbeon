[package]
name = "hanbeon"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "상황적응형 싱글스위치 접근성 소프트웨어"

[lib]
name = "hanbeon_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: floating 창의 투명 배경(tauri.conf.json의 macOSPrivateApi)에 필요하다.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
enigo = "0.6.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
serialport = "4.9.0"
# reqwest는 app_registry(앱 프로필), ureq는 registry(보드 펌웨어)에서 쓴다.
# 두 클라이언트의 역할이 다르므로 지금은 병행한다.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
ureq = "3.4.0"
sha2 = "0.11.0"
unicode-normalization = "0.1.25"
btleplug = { version = "0.11", features = ["serde"] }
futures = "0.3.34"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = "1.25.0"

# 이후 단계에서 붙일 crate. 버전은 반드시 `cargo add`로 확정한다.
#   cargo add tauri-plugin-store             # 사용자 프로필 영속화 (M3)
#   cargo add rodio                          # 청각 피드백 (M2)

[target."cfg(target_os = \"macos\")".dependencies]
accessibility = "0.2.0"
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"
# floating 창이 대상 앱의 포커스를 뺏지 않도록 NSPanel(nonactivating)로 승격할 때 사용한다.
#   cargo add objc2 objc2-app-kit
